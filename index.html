h2{color:var(--accent);font-size:1.3rem;margin:.2rem 0 .8rem}h3{color:var(--blue);font-size:1.1rem}
.lead{color:var(--muted)}
.chain{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:center;margin:1rem 0}
.node{background:var(--accent);color:#fff;border-radius:12px;padding:.6rem .8rem;text-align:center;min-width:120px;cursor:pointer;transition:transform .15s}
.node:hover{transform:translateY(-3px)}.node b{display:block;font-size:1.3rem}
.arrow{color:var(--muted);font-size:1.4rem}html[dir=rtl] .arrow{transform:scaleX(-1)}
.phase{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.phase span{background:var(--soft);padding:.2rem .7rem;border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:1rem}
.block{border:1px solid var(--line);border-top:5px solid var(--accent);border-radius:12px;padding:1rem;background:#fffdf8}
.block .hdr{display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
.badge{background:var(--blue);color:#fff;border-radius:999px;padding:.1rem .7rem;font-size:.8rem}
.quran{font-family:'Amiri',serif;font-size:1.35rem;direction:rtl;text-align:right;color:#3b2a14;background:var(--soft);border-radius:8px;padding:.6rem .8rem;margin:.6rem 0;line-height:2}
.tr{font-style:italic;color:var(--muted);font-size:.92rem}
.hash{font-family:'Inter',monospace;font-size:.82rem;background:#eef3f8;border-radius:6px;padding:.4rem .6rem;margin-top:.5rem;color:var(--blue)}
.tablewrap{overflow-x:auto;margin:.6rem 0}table{width:100%;border-collapse:collapse;min-width:520px}
th,td{border:1px solid var(--line);padding:.55rem;text-align:start;vertical-align:top}th{background:var(--soft)}
tr.new td{background:#fff5f5}
.note{border-inline-start:4px solid var(--accent);background:#fff5f5;padding:.7rem 1rem;border-radius:6px;margin:.6rem 0}
.svgwrap{overflow-x:auto;background:#fcfbf8;border:1px solid var(--line);border-radius:10px;padding:.5rem;margin:.6rem 0}
.svgwrap svg{display:block;margin:auto;width:100%;max-width:640px;height:auto;font-family:'Noto Naskh Arabic','Inter',sans-serif}
.legend{display:flex;flex-wrap:wrap;gap:1rem;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:34px;border-top:3px solid var(--ink);vertical-align:middle;margin-inline-end:.3rem}
.legend i.dash{border-top-style:dashed}.legend i.dot{border-top-style:dotted}
ul.rules li{margin:.2rem 0}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:1.5rem 1rem}
@media(max-width:600px){header h1{font-size:.88rem}.node{min-width:44%}.arrow{display:none}.quran{font-size:1.2rem}section{padding:.9rem}}

ant", "blocksH": "The five blocks", "order": "Revelation order", "supH": "Supporting layer", "supP": "Verses that do not mention the Sabbath but explain why it was relocated. They link to the chain; they are not blocks in it.", "supCols": ["Passage", "Function"], "compH": "The Sabbath: Torah vs. Qur'an", "compCols": ["Dimension", "Torah", "Qur'an"], "limH": "Limits of the blockchain analogy", "taxH": "Typology of Qur'anic links", "taxP": "Two new types are added (highlighted): the undirected parallel link and the interpretation-branching link.", "taxCols": ["#", "Type", "Direction", "Evidence", "Core statistics"], "k4H": "Type 4: Undirected parallel link", "k4Def": "A connection between two or more passages based on a shared referential target and a shared structure, without either referring to the other and without an established chronological priority. Model: Al-Hajj 22:16 and An-Nur 24:46, both general statements of 'sending down' that point to revelation as a whole.", "q4a": "وَكَذَٰلِكَ أَنزَلْنَاهُ آيَاتٍ بَيِّنَاتٍ وَأَنَّ اللَّهَ يَهْدِي مَن يُرِيدُ", "q4b": "لَّقَدْ أَنزَلْنَا آيَاتٍ مُّبَيِّنَاتٍ ۚ وَاللَّهُ يَهْدِي مَن يَشَاءُ إِلَىٰ صِرَاطٍ مُّسْتَقِيمٍ", "parCols": ["Parallel element", "Al-Hajj 22:16", "An-Nur 24:46"], "r4": ["Edge between the verses: dashed line, no arrowhead.", "Weight = matched elements ÷ observed elements (4 of 5 = 0.8).", "Derived from co-citation of the shared target node 'revelation'.", "Excluded from in/out-degree; counted in undirected degree and clustering."], "k5H": "Type 5: Interpretation-branching link", "k5Def": "A link whose referential edge starts from one verse but whose target varies with exegetical opinions; each target receives a weight reflecting the strength of its opinion, and weights sum to 1. Model: An-Nazi'at 79:25.", "q5": "فَأَخَذَهُ اللَّهُ نَكَالَ الْآخِرَةِ وَالْأُولَىٰ", "brCols": ["Opinion", "Meaning of 'the last and the first'", "Target", "Weight"], "r5": ["Fixed edge (causal 'fa' to 79:24): thick solid line, weight 1.", "Probabilistic edges: dotted lines, with w1 + w2 = 1.", "Weights from the share of exegetes in a defined sample, or by preference (0.7 / 0.3).", "Recompute centrality under each opinion alone to test sensitivity to disagreement."], "lgS": "Directed reference", "lgD": "Undirected parallel", "lgO": "Probabilistic edge", "s1a": "Al-Hajj 16", "s1b": "An-Nur 46", "s1w1": "Revelation", "s1w2": "general node", "s1h5": "Al-Hajj 5-7", "s1par": "parallel 0.8", "s1gen": "general ref.", "s1anc": "'thus'", "s2c": "An-Nazi'at 25", "s2cq": "the last and the first", "s2a": "An-Nazi'at 24", "s2y": "Yunus 90-92", "s2g": "Ghafir 46", "s2q": "Al-Qasas 38", "s2fa": "causal 'fa': 1", "s2o1": "Opinion 1: w1", "s2o2": "Opinion 2: w2", "conH": "Conclusion", "conP": "The closest computing metaphor for the Sabbath is a sidechain: linked to the parent chain by confirmation, yet independent in obligation. A 'hard fork' is inaccurate, since it implies rupture, whereas the Qur'an is 'confirming what came before it'. The primary vocabulary remains Qur'anic: covenant, confirmation, supremacy (haymana), and restricting a ruling to its people.", "caveat": "Methodological note: revelation order is approximate, and the Meccan status of some verses in An-Nahl and Al-Hajj is disputed; opinion weights for 79:25 are to be set after reviewing the tafsir sources.", "foot": "Part of the project: The Hypertextual Structure of the Qur'an — working research draft"}},$=id=>document.getElementById(id);
